    .heading { fill: #18181B; font-size: 20px; font-weight: 600; letter-spacing: -.5px; }
    .label { fill: #62626B; font-size: 13px; font-weight: 600; }
    .footer { fill: #62626B; font-size: 11px; font-weight: 500; }
    .domain { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-weight: 400; }
  </style>
  <rect x=".5" y=".5" width="359" height="389" rx="12" fill="#FFFFFF" stroke="#E3E3E8"/>
  <text x="25" y="42" class="label">Experience</text>
