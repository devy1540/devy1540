<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 736 342" role="img" aria-labelledby="title desc">
  <title id="title">Applied AI Engineer | Backend Engineer</title>
  <desc id="desc">AI를 활용하고, 제품으로 완성합니다. 설계부터 구현·운영까지, 직접 만들고 검증합니다. AI, Backend, Infra의 신호가 Product로 모이는 연결도.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .muted { fill: #62626B; }
    .wire { fill: none; stroke: #E3E3E8; stroke-width: 1.25; }
    .node { fill: #FAFAFA; stroke: #E3E3E8; }
    .signal { fill: #555560; opacity: 0; offset-rotate: 0deg; animation: travel 6s linear infinite; }
    .ai { offset-path: path("M76 28 H89 Q103 28 103 42 V70 Q103 84 117 84 H145"); }
    .backend { offset-path: path("M76 84 H145"); animation-delay: .35s; }
    .infra { offset-path: path("M76 140 H89 Q103 140 103 126 V98 Q103 84 117 84 H145"); animation-delay: .7s; }
    .receipt { fill: #555560; opacity: .3; animation: receive 6s ease-in-out infinite; }
    @keyframes travel {
      0% { offset-distance: 0%; opacity: 0; }
      5%, 45% { opacity: .85; }
      50%, 100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes receive {
      0%, 48%, 83%, 100% { opacity: .3; }
      64%, 70% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal { animation: none; display: none; }
      .receipt { animation: none; opacity: .5; }
    }
  </style>
  <rect x=".5" y=".5" width="735" height="341" rx="12" fill="#FFFFFF" stroke="#E3E3E8"/>
  <text x="36" y="49" class="muted" font-size="12" font-weight="500">Applied AI Engineer <tspan fill="#E3E3E8"> | </tspan> Backend Engineer</text>
  <g fill="#18181B" font-size="34" font-weight="750" letter-spacing="-1.5">
    <text x="36" y="121">AI를 활용하고,</text>
    <text x="36" y="167">제품으로 완성합니다.</text>
  </g>
  <g class="muted" font-size="13">
    <text x="36" y="213">설계부터 구현·운영까지,</text>
    <text x="36" y="237">직접 만들고 검증합니다.</text>
  </g>
  <g transform="translate(453 82)">
    <path class="wire" d="M76 28H89Q103 28 103 42V70Q103 84 117 84H145M76 84H145M76 140H89Q103 140 103 126V98Q103 84 117 84"/>
    <rect class="node" x=".5" y="9.5" width="75" height="37" rx="5"/>
    <rect class="node" x=".5" y="65.5" width="75" height="37" rx="5"/>
    <rect class="node" x=".5" y="121.5" width="75" height="37" rx="5"/>
    <g class="muted" text-anchor="middle" font-size="12" font-weight="450">
      <text x="38" y="32">AI</text>
      <text x="38" y="88">Backend</text>
      <text x="38" y="144">Infra</text>
    </g>
    <g aria-hidden="true">
      <circle class="signal ai" r="2.6"/>
      <circle class="signal backend" r="2.6"/>
      <circle class="signal infra" r="2.6"/>
    </g>
    <rect x="145.5" y="47.5" width="100" height="73" rx="7" fill="#FFFFFF" stroke="#62626B"/>
    <text x="195" y="77" text-anchor="middle" fill="#18181B" font-size="15" font-weight="600">Product</text>
    <circle class="receipt" cx="160" cy="99" r="2.5" aria-hidden="true"/>
    <text x="201" y="103" text-anchor="middle" class="muted" font-size="11">Build · Verify</text>
  </g>
  <path d="M36 282H700" stroke="#E3E3E8"/>
  <text x="36" y="309" class="muted" font-size="11" font-weight="500" letter-spacing="1.1">BACKEND · AI · INFRASTRUCTURE</text>
  <text x="700" y="309" text-anchor="end" class="muted" font-size="11" style="font-family: ui-monospace, SFMono-Regular, Consolas, monospace">dev.devy.dev</text>
</svg>
