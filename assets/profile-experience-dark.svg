<svg xmlns="http://www.w3.org/2000/svg" width="860" height="290" viewBox="0 0 736 248" role="img" aria-labelledby="title desc">
  <title id="title">Experience | AI Agents · Backend · Infrastructure</title>
  <desc id="desc">AI 진단·상담 보조·개발 및 리뷰 에이전트, 결제·인증·알림, 클라우드 이관·GitOps·관측 환경. 자세한 경험과 개발 기록은 dev.devy.dev에서 확인할 수 있습니다.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .muted { fill: #A3ADB9; }
    .copy { fill: #E2E7EE; font-size: 12px; font-weight: 500; }
    .heading { fill: #EEF1F5; font-size: 20px; font-weight: 600; letter-spacing: -.5px; }
    .label { fill: #A3ADB9; font-size: 13px; font-weight: 600; }
    .footer { fill: #A3ADB9; font-size: 11px; font-weight: 500; }
    .domain { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-weight: 400; }
  </style>
  <rect x=".5" y=".5" width="735" height="247" rx="12" fill="#0D1117" stroke="#323A45"/>
  <text x="28" y="42" class="label">Experience</text>
  <path d="M28 129H708" stroke="#323A45"/>
  <path d="M28 169H708" stroke="#323A45"/>
  <path d="M28 212H708" stroke="#323A45"/>
